<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f3f6fb;--pn:#fff;--tx:#14213d;--mu:#55627a;--bd:#d6deea;--ac:#1d6fd1;--tb:#e6f0ff;--sb:#dff7ea;--ok:#0f7a4a;--no:#b4233c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--pn:#131d33;--tx:#eef3fb;--mu:#9fb0cc;--bd:#263652;--ac:#5aa7ff;--tb:#17284a;--sb:#12362a;--ok:#4fd39a;--no:#ff8aa0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--pn:#131d33;--tx:#eef3fb;--mu:#9fb0cc;--bd:#263652;--ac:#5aa7ff;--tb:#17284a;--sb:#12362a;--ok:#4fd39a;--no:#ff8aa0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:820px;margin:auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
.hd{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:10px 14px}
.hd h1{margin:0;font-size:18px}.hd small{color:var(--mu)}
#map{display:flex;gap:6px;margin-top:8px;overflow-x:auto}#map span{flex:1;min-width:92px;text-align:center;font-size:12px;font-weight:700;padding:6px 4px;border-radius:10px;border:1px solid var(--bd);color:var(--mu)}
#map .on{border-color:var(--ac);color:var(--ac)}#map .dn{background:var(--sb);color:var(--ok);border-color:var(--ok)}
#bar{height:8px;border-radius:6px;background:var(--bd);margin-top:8px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .6s}

.tb{background:var(--tb);align-self:flex-start;border-top-right-radius:4px}.sb{background:var(--sb);align-self:flex-end;border-top-left-radius:4px}
.tb::before{content:"🤖 المرشد";display:block;font-size:12px;color:var(--ac);font-weight:800}
.ok{color:var(--ok);font-weight:800}.no{color:var(--no);font-weight:800}
#act{position:sticky;bottom:0;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--bd)}
button,input{font:700 16px Tajawal;border-radius:12px;border:1px solid var(--bd);padding:10px 14px;background:var(--pn);color:var(--tx)}
button{cursor:pointer;min-height:44px}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input{flex:1;min-width:200px}
.cut{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:10px;width:100%}.cut .bar{height:26px;background:var(--ac);border-radius:6px;transition:width .4s;min-width:3px;margin:8px 0}
.cut table{width:100%;border-collapse:collapse;font-size:14px}.cut td{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:center}

.v{display:none;flex-direction:column;gap:10px}.v.on{display:flex}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ls{display:flex;flex-direction:column;gap:6px}.ls.lk{opacity:.55}.ls b{font-size:17px}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-weight:800}select{font:700 16px Tajawal;border-radius:12px;border:1px solid var(--bd);padding:10px;background:var(--pn);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.q{font-size:26px;font-weight:800;text-align:center;padding:14px}.tm{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.tm i{display:block;height:100%;background:var(--ac);width:100%}
.pg{background:#fff;color:#111;border-radius:12px;padding:22px;line-height:1.9}.pg h2{margin:0 0 6px}.pg table{width:100%;border-collapse:collapse;margin:8px 0}.pg td,.pg th{border:1px solid #999;padding:4px 8px;text-align:center}
.ct{background:#fffdf5;color:#1b2a41;border:10px double #b8892b;border-radius:6px;padding:34px 24px;text-align:center;line-height:2}
.ct h2{font-size:34px;color:#8a5a00;margin:0}.ct .nm{font-size:34px;font-weight:800;border-bottom:2px dashed #b8892b;display:inline-block;padding:0 24px}
.sg{display:flex;justify-content:space-around;margin-top:26px;font-weight:700}.sg span{border-top:1px solid #333;padding-top:4px;min-width:170px}
@media print{body{background:#fff}.np{display:none!important}.v{display:none!important}.v.on{display:flex!important}.pg,.ct{border-radius:0}.ct{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

:root{--g1:#c9e7ff;--g2:#ffe2c2}

h2{font-family:'Reem Kufi',Tajawal,sans-serif}
button.p{background:linear-gradient(135deg,#1d6fd1,#6a3fd1);border:0;box-shadow:0 4px 12px rgba(60,60,200,.3)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#0b3b8f,#6a2fb5);display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(40,30,120,.25)}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#ffd54a,#ff8a3d);color:#3a1d00;display:flex;align-items:center;justify-content:center;font:400 36px Lalezar;border:4px solid #fff;flex:none}

.lv{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 12px;font-weight:800;font-size:14px}

.atom{position:absolute;left:-14px;top:-14px;opacity:.9}.atom .sp{transform-origin:60px 60px;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.st{position:relative;display:flex;flex-direction:column;gap:6px;padding-right:62px}
.st::before{content:"";position:absolute;right:26px;top:56px;bottom:-14px;border-right:4px dotted var(--bd)}.st:last-child::before{display:none}
.st .nb{position:absolute;right:0;top:0;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 28px Lalezar;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.st .cd2{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .2s,box-shadow .2s}.st .cd2:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.st b{font-size:18px}.dn2{color:var(--ok);font-weight:800}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tl button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:0;border-radius:18px;color:#fff;font-size:16px;box-shadow:0 5px 14px rgba(0,0,0,.2)}.tl button span{font-size:34px}

.win .go{margin-top:12px;border:0;border-radius:40px;background:linear-gradient(135deg,#ffd54a,#ff8a3d);color:#3a1d00;font-size:22px;font-weight:800;padding:14px 38px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}.win small{color:#d9ceff;margin-top:8px}
.win .tz{position:absolute;left:0;right:0;bottom:0;height:11px;background:repeating-linear-gradient(90deg,#e4312b 0 14px,#fff 14px 18px,#149954 18px 32px,#111 32px 36px)}
.w2c{max-width:560px;margin:3vh auto;width:100%;padding:22px;gap:12px}
.cr{margin-top:16px;display:flex;flex-direction:column;gap:3px;align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.35);width:min(420px,90%)}.cr b{font-size:clamp(16px,4vw,21px);font-weight:800;color:#fff}.cr span{font-size:clamp(13px,3.4vw,16px);color:#e8e1ff}
.cr2{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.cr2 b{font-size:15px}.cr2 span{font-size:13px;color:var(--mu)}
